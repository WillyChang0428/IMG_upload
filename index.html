<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中和兒童圖書館</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@200..900&display=swap');
        body{
            background-color: #222222;
            padding: 0;
            margin: 0;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            color: #ffffff;
        }
        h1,h2,h3,h4,h5,h6{
            color: #FFFFFF;
        }
        .logo{
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding-top: 10px;
        }
        .logo-text{
            font-size:40px;
            font-family:'Chiron GoRound TC', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }
        .logo img{
            width: 80px;
            height: 80px;
        }
        .search{
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .search .container{
            width: 80%;
            height: 50%;
            background-color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center; 
            border-radius: 10px;
            padding: 10px;
        }

        .search input{
            width: 100%;
            height: 90%;
            border-radius: 10px;
            border: none;
            font-size: 24px;
            text-align: center;
        }
        .search button{
            width: 70px;
            height: 90%;
            border-radius: 10px;
            border: none;
            background-color: #016959;
            color: #ffffff;
            font-size: 16px;
        }
        .search button:active{
            background-color: #004A3E;
        }


        .new-books{
            padding: 20px 0;
        }

        .calendar-card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .calendar-header {
            background-color: #BA7A6A; 
            color: white;
        }
        .calendar-header button {
            color: white;
            border-color: white;
        }
        .calendar-header button:hover {
            background-color: white;
            color: #BA7A6A;
        }
        .table th {
            background-color: #f8f9fa;
            color: #ffffff;
        }
        .table td {
            height: 60px;
            vertical-align: middle;
            cursor: pointer;
            transition: 0.2s;
        }
        .table td:hover {
            background-color: #e9ecef;
        }
        /* 標示今天的樣式 */
        .today {
            background-color: #BA7A6A !important;
            color: white !important;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="./image/LOGO.svg" alt="">
            <span class="logo-text">
                中和兒童圖書館
            </span>
        </div>
    </header>
    <form  class="search" action="">
        <div class="container">
            <input type="text" placeholder="根據關鍵字搜尋目錄">
            <button type="submit">
                搜尋
            </button>
        </div>
    </form>
    <div class="navbar">
        <ul>
            <li class="label">
                <h3>首頁</h3>
            </li>
            <li class="label">
                <h3>館藏查詢</h3>
            </li>
            <li class="label">
                <h3>讀者服務</h3>
            </li>
            <li class="label">
                <h3>關於本館</h3>
            </li>
        </ul>
    </div>
    <a href=""></a>
    <div class="container new-books">
        <h2>新書到館</h2>
        <div id="carouselExampleIndicators" class="carousel slide w-100 mx-auto" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <div class="d-flex justify-content-center align-items-center">
                        <img src="./image/book1.jpeg" class="d-block w-20" alt="...">
                    </div>
                </div>
                <div class="carousel-item">
                    <div class="d-flex justify-content-center align-items-center">
                        <img src="./image/book2.jpeg" class="d-block w-20" alt="...">
                    </div>
                </div>
                <div class="carousel-item">
                    <div class="d-flex justify-content-center align-items-center">
                        <img src="./image/book3.jpeg" class="d-block w-20" alt="...">
                    </div>
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>
    <div class="container" style="max-width: 400px;">
        <div class="card calendar-card">
            <!-- 月曆頭部：控制月份 -->
            <div class="card-header calendar-header d-flex justify-content-between align-items-center p-3">
                <button id="prev-month" class="btn btn-sm btn-outline-light">&lt;</button>
                <h5 id="month-year" class="mb-0 fw-bold"></h5>
                <button id="next-month" class="btn btn-sm btn-outline-light">&gt;</button>
            </div>
            
            <!-- 月曆主體：表格 -->
            <div class="card-body p-0">
                <table class="table table-bordered text-center mb-0">
                    <thead>
                        <tr>
                            <th class="text-danger">日</th>
                            <th class="text-success">一</th>
                            <th class="text-success">二</th>
                            <th class="text-success">三</th>
                            <th class="text-success">四</th>
                            <th class="text-success">五</th>
                            <th class="text-danger">六</th>
                        </tr>
                    </thead>
                    <tbody id="calendar-body">
                        <!-- JavaScript 會在這裡動態生成日期 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js" integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        const calendarBody = document.getElementById("calendar-body");
        const monthYearText = document.getElementById("month-year");
        const prevBtn = document.getElementById("prev-month");
        const nextBtn = document.getElementById("next-month");

        let today = new Date();
        let currentMonth = today.getMonth();
        let currentYear = today.getFullYear();

        const months = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];

        // 渲染月曆的主要函數
        function generateCalendar(month, year) {
            // 清空舊的內容
            calendarBody.innerHTML = "";

            // 設定標題的年月
            monthYearText.innerText = `${year}年 ${months[month]}`;

            // 取得該月第一天是星期幾 (0-6)
            let firstDay = new Date(year, month, 1).getDay();
            // 取得該月有幾天 (利用下個月的第 0 天來反推)
            let daysInMonth = new Date(year, month + 1, 0).getDate();

            let date = 1;
            
            // 最多生成 6 列表格 (因為一個月最多跨 6 個星期)
            for (let i = 0; i < 6; i++) {
                let row = document.createElement("tr");

                for (let j = 0; j < 7; j++) {
                    let cell = document.createElement("td");

                    if (i === 0 && j < firstDay) {
                        // 填補第一天之前的空白格子
                        let cellText = document.createTextNode("");
                        cell.appendChild(cellText);
                        row.appendChild(cell);
                    } else if (date > daysInMonth) {
                        // 日期超過該月天數，後續直接跳出
                        break;
                    } else {
                        // 填入日期
                        let cellText = document.createTextNode(date);
                        cell.appendChild(cellText);

                        // 判斷是否為「今天」，若是則加上 highlight 樣式
                        if (date === today.getDate() && year === today.getFullYear() && month === today.getMonth()) {
                            cell.classList.add("today");
                        }

                        row.appendChild(cell);
                        date++;
                    }
                }
                calendarBody.appendChild(row);
                
                // 如果這一列印完，日期已經超過總天數，就不需要印下一列了
                if (date > daysInMonth) {
                    break;
                }
            }
        }

        // 綁定按鈕事件：上個月
        prevBtn.addEventListener("click", () => {
            currentYear = (currentMonth === 0) ? currentYear - 1 : currentYear;
            currentMonth = (currentMonth === 0) ? 11 : currentMonth - 1;
            generateCalendar(currentMonth, currentYear);
        });

        // 綁定按鈕事件：下個月
        nextBtn.addEventListener("click", () => {
            currentYear = (currentMonth === 11) ? currentYear + 1 : currentYear;
            currentMonth = (currentMonth === 11) ? 0 : currentMonth + 1;
            generateCalendar(currentMonth, currentYear);
        });

        // 初始化第一次渲染
        generateCalendar(currentMonth, currentYear);

    </script>
</body>

</html>
